<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTC現在地">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BTC現在地</title>
  <style>
    :root{
      --bg:#05070b;
      --card:#10141c;
      --card2:#151b25;
      --line:#252d3a;
      --text:#f5f7fb;
      --muted:#8d99aa;
      --muted2:#5f6b7a;
      --accent:#ffffff;
      --blue:#69b7ff;
      --green:#4ade80;
      --yellow:#facc15;
      --red:#fb7185;
      --shadow:0 18px 45px rgba(0,0,0,.36);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:15px;}
    body{min-height:100vh;padding-bottom:calc(22px + env(safe-area-inset-bottom));}
    .wrap{width:min(780px,100%);margin:0 auto;padding:18px 14px 28px;}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px;}
    h1{font-size:20px;line-height:1.1;margin:0;font-weight:750;letter-spacing:.01em;}
    .status{font-size:11px;color:var(--muted);text-align:right;line-height:1.35;white-space:nowrap;}
    .hero{background:linear-gradient(180deg,#171d27,#0d1118);border:1px solid var(--line);border-radius:24px;padding:20px 18px 18px;box-shadow:var(--shadow);margin-bottom:12px;}
    .heroTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;}
    .eyebrow{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;}
    .price{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;}
    .date{font-size:12px;color:var(--muted);margin-top:7px;}
    .decision{min-width:128px;text-align:right;}
    .pill{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;color:var(--text);background:#0b0f15;}
    .pill.watch{border-color:#4b5563;color:#d4d9e2;}
    .pill.ready{border-color:#276749;color:#bbf7d0;background:#082112;}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;}
    .metric{background:#090d13;border:1px solid var(--line);border-radius:16px;padding:12px 10px;min-height:78px;}
    .metricLabel{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;line-height:1.25;}
    .metricValue{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
    .metricValue.red{color:var(--red)}
    .metricValue.green{color:var(--green)}
    .oneLine{margin-top:14px;color:#d8dee8;font-size:13px;line-height:1.5;}
    .bar{display:flex;gap:8px;align-items:center;margin:12px 0;}
    button{appearance:none;border:1px solid var(--line);background:#111722;color:var(--text);border-radius:999px;min-height:42px;padding:9px 14px;font-size:13px;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
    button:active{transform:translateY(1px)}
    .update{margin-left:auto;background:#f5f7fb;color:#05070b;border-color:#f5f7fb;}
    .msg{display:none;border:1px solid var(--line);border-radius:14px;background:#0e131b;color:var(--muted);font-size:12px;line-height:1.5;padding:10px 12px;margin:8px 0 12px;white-space:pre-wrap;}
    .msg.show{display:block}
    .chartCard{background:linear-gradient(180deg,#111722,#0a0e14);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow);}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px;}
    .tab{border-radius:14px;min-height:40px;padding:8px 5px;font-size:12px;background:#090d13;color:var(--muted);}
    .tab.active{background:#f5f7fb;color:#05070b;border-color:#f5f7fb;}
    .range{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px;}
    .range.show{display:grid;}
    .range button{border-radius:13px;min-height:36px;padding:7px 5px;font-size:12px;background:#090d13;color:var(--muted);}
    .range button.active{background:#263142;color:#fff;border-color:#39465a;}
    .canvasWrap{height:354px;border:1px solid #202838;border-radius:18px;background:#06090e;padding:8px;overflow:hidden;}
    canvas{display:block;width:100%;height:100%;}
    .legend{display:flex;flex-wrap:wrap;gap:7px;margin:11px 2px 2px;}
    .leg{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:999px;background:#090d13;padding:5px 8px;}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
    .note{font-size:11px;color:var(--muted2);line-height:1.5;margin:10px 3px 2px;}
    details{margin-top:12px;border:1px solid var(--line);border-radius:18px;background:#0a0e14;padding:12px 14px;color:var(--muted);}
    summary{font-size:12px;font-weight:800;color:#cbd5e1;cursor:pointer;}
    .detail{font-size:12px;line-height:1.7;margin-top:10px;}
    .footer{font-size:11px;color:var(--muted2);line-height:1.45;margin-top:13px;text-align:center;}
    @media (max-width:560px){
      .wrap{padding:14px 10px 24px;}
      h1{font-size:19px;}
      .hero{border-radius:22px;padding:18px 14px 15px;}
      .price{font-size:39px;}
      .heroTop{gap:8px;}
      .decision{min-width:108px;}
      .pill{font-size:11px;padding:7px 9px;}
      .metrics{grid-template-columns:repeat(3,1fr);gap:6px;}
      .metric{padding:10px 8px;min-height:72px;border-radius:14px;}
      .metricLabel{font-size:10px;}
      .metricValue{font-size:18px;}
      .tabs{grid-template-columns:repeat(5,1fr);gap:5px;}
      .tab{font-size:11px;min-height:38px;padding:7px 3px;}
      .canvasWrap{height:326px;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>BTC現在地</h1>
      <div class="status" id="topStatus">未取得</div>
    </header>

    <section class="hero">
      <div class="heroTop">
        <div>
          <div class="eyebrow">BTC / USD</div>
          <div class="price" id="latestPrice">--</div>
          <div class="date" id="latestDate">--</div>
        </div>
        <div class="decision"><span class="pill watch" id="conditionPill">監視</span></div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metricLabel">ATH後</div>
          <div class="metricValue" id="athDays">--</div>
        </div>
        <div class="metric">
          <div class="metricLabel">ATH比</div>
          <div class="metricValue red" id="currentDd">--</div>
        </div>
        <div class="metric">
          <div class="metricLabel">60,000条件</div>
          <div class="metricValue" id="sixtyCondition">--</div>
        </div>
      </div>
      <div class="oneLine" id="positionLine">データ未取得。更新する。</div>
    </section>

    <div class="bar">
      <button class="update" id="fetchBtn">更新</button>
    </div>
    <div class="msg" id="message"></div>

    <section class="chartCard">
      <div class="tabs" id="tabs">
        <button class="tab active" data-mode="daily">日足</button>
        <button class="tab" data-mode="weekly">週足</button>
        <button class="tab" data-mode="monthly">月足</button>
        <button class="tab" data-mode="yearly">年足</button>
        <button class="tab" data-mode="cycle">ATH</button>
      </div>
      <div class="range" id="rangeTabs">
        <button data-range="500">500日</button>
        <button data-range="1000">1000日</button>
        <button data-range="1500" class="active">1500日</button>
        <button data-range="all">全期間</button>
      </div>
      <div class="canvasWrap"><canvas id="chart"></canvas></div>
      <div class="legend" id="legend"></div>
      <div class="note" id="chartNote">価格チャートは日足終値ベース。長期確認のため対数表示。</div>
    </section>

    <details>
      <summary>データと前提</summary>
      <div class="detail" id="dataDetail">
        ・価格はBinance BTCUSDTの日足終値。<br>
        ・週足、月足、年足は日足終値から各期間の最終終値を抽出。ローソク足ではない。<br>
        ・ATH比較は、開始ATHを0%として次ATHまたは現在までを表示。<br>
        ・これは位置確認用。売買判断ではない。
      </div>
    </details>

    <div class="footer">v2.0 minimal / APIキー不要 / GitHub Pages対応</div>
  </div>

<script>
(() => {
  'use strict';

  const APP_VERSION = '2.0-minimal';
  const STORAGE_KEY = 'btc_position_v2_0_data';
  const MODE_KEY = 'btc_position_v2_0_mode';
  const RANGE_KEY = 'btc_position_v2_0_cycle_range';
  const DAY_MS = 24 * 60 * 60 * 1000;
  const START_MS = Date.UTC(2017, 7, 17);
  const SIXTY_K = 60000;
  const ENDPOINTS = [
    'https://api.binance.com',
    'https://api-gcp.binance.com',
    'https://api1.binance.com',
    'https://api2.binance.com',
    'https://api3.binance.com',
    'https://api4.binance.com'
  ];
  const COLORS = {
    cycle2017: '#facc15',
    prevCycle: '#4ade80',
    current: '#fb7185',
    price: '#69b7ff'
  };

  const $ = (id) => document.getElementById(id);
  const state = {
    candles: [],
    source: '',
    savedAt: '',
    mode: localStorage.getItem(MODE_KEY) || 'daily',
    range: localStorage.getItem(RANGE_KEY) || '1500',
    analysis: null
  };

  function fmtUsd(v) {
    if (!Number.isFinite(v)) return '--';
    return '$' + Math.round(v).toLocaleString('en-US');
  }

  function fmtPct(v) {
    if (!Number.isFinite(v)) return '--';
    const sign = v > 0 ? '+' : '';
    return sign + v.toFixed(1) + '%';
  }

  function fmtAxisPct(v) {
    if (!Number.isFinite(v)) return '--';
    if (Math.abs(v) < 0.05) return '0%';
    const sign = v > 0 ? '+' : '−';
    return sign + Math.abs(v).toFixed(0) + '%';
  }

  function fmtDate(ms) {
    if (!Number.isFinite(ms)) return '--';
    const d = new Date(ms);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  }

  function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / DAY_MS);
  }

  function setMessage(text) {
    const el = $('message');
    if (!text) {
      el.className = 'msg';
      el.textContent = '';
      return;
    }
    el.className = 'msg show';
    el.textContent = text;
  }

  function setTopStatus(text) {
    $('topStatus').innerHTML = text || '未取得';
  }

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function fetchKlinesFromBase(base) {
    const out = [];
    let start = START_MS;
    const end = Date.now();
    for (let i = 0; i < 20; i++) {
      const url = `${base}/api/v3/klines?symbol=BTCUSDT&interval=1d&startTime=${start}&endTime=${end}&limit=1000`;
      const rows = await fetchJson(url);
      if (!Array.isArray(rows) || rows.length === 0) break;
      for (const row of rows) {
        const t = Number(row[0]);
        const close = Number(row[4]);
        if (Number.isFinite(t) && Number.isFinite(close)) out.push({ t, close });
      }
      const lastOpen = Number(rows[rows.length - 1][0]);
      const next = lastOpen + DAY_MS;
      if (!Number.isFinite(next) || next <= start) break;
      start = next;
      if (Date.now() - start < DAY_MS) break;
      await new Promise(resolve => setTimeout(resolve, 80));
    }
    const unique = new Map();
    for (const c of out) unique.set(c.t, c);
    return Array.from(unique.values()).sort((a, b) => a.t - b.t);
  }

  async function fetchAllData() {
    const errors = [];
    for (const base of ENDPOINTS) {
      try {
        setTopStatus('取得中<br>' + base.replace('https://', ''));
        const candles = await fetchKlinesFromBase(base);
        if (candles.length < 1000) throw new Error('データ不足 ' + candles.length + '本');
        return { candles, source: base };
      } catch (err) {
        errors.push(base + ' : ' + err.message);
      }
    }
    throw new Error(errors.join('\n'));
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: APP_VERSION,
      candles: state.candles,
      source: state.source,
      savedAt: new Date().toISOString()
    }));
  }

  function loadSavedData() {
    const keys = [
      STORAGE_KEY,
      'btc_cycle_anomaly_v1_9_data',
      'btc_cycle_anomaly_v1_8_data',
      'btc_cycle_anomaly_v1_7_data',
      'btc_cycle_anomaly_v1_6_data',
      'btc_cycle_anomaly_v1_5_data',
      'btc_cycle_anomaly_v1_4_data',
      'btc_cycle_anomaly_v1_3_data',
      'btc_cycle_anomaly_v1_2_data'
    ];
    let raw = '';
    for (const key of keys) {
      raw = localStorage.getItem(key);
      if (raw) break;
    }
    if (!raw) throw new Error('保存データなし');
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.candles) || !data.candles.length) throw new Error('保存データ不正');
    state.candles = data.candles.map(c => ({ t: Number(c.t), close: Number(c.close) })).filter(c => Number.isFinite(c.t) && Number.isFinite(c.close));
    state.source = data.source || '保存データ';
    state.savedAt = data.savedAt || '';
  }

  function sliceRange(candles, startMs, endMs) {
    return candles.filter(c => c.t >= startMs && c.t <= endMs);
  }

  function findMaxInRange(candles, startStr, endStr) {
    const range = sliceRange(candles, parseDate(startStr), parseDate(endStr));
    if (!range.length) return null;
    return range.reduce((max, c) => c.close > max.close ? c : max, range[0]);
  }

  function buildSegmentToEnd(candles, startCandle, endCandle, label, color) {
    if (!startCandle || !endCandle) return null;
    const range = sliceRange(candles, startCandle.t, endCandle.t);
    const points = range.map(c => ({
      x: daysBetween(startCandle.t, c.t),
      y: (c.close / startCandle.close - 1) * 100,
      t: c.t,
      price: c.close
    }));
    return { label, color, points, start: startCandle, end: endCandle };
  }

  function analyze(candles) {
    const latest = candles[candles.length - 1];
    const peak2017 = findMaxInRange(candles, '2017-11-01', '2018-02-28');
    const peak2021 = findMaxInRange(candles, '2021-10-01', '2022-01-31');
    const currentPeak = findMaxInRange(candles, '2024-01-01', fmtDate(latest.t));
    if (!peak2017 || !peak2021 || !currentPeak) throw new Error('ATH基準を算出できない');
    const athToAthSegments = [
      buildSegmentToEnd(candles, peak2017, peak2021, '2017 ATH→前回ATH', COLORS.cycle2017),
      buildSegmentToEnd(candles, peak2021, currentPeak, '前回ATH→現在ATH', COLORS.prevCycle),
      buildSegmentToEnd(candles, currentPeak, latest, '現在ATH→現在', COLORS.current)
    ].filter(Boolean);
    const currentDrawdown = (latest.close / currentPeak.close - 1) * 100;
    return {
      latest,
      peak2017,
      peak2021,
      currentPeak,
      currentDays: Math.max(0, daysBetween(currentPeak.t, latest.t)),
      currentDrawdown,
      athToAthSegments
    };
  }

  function weeklyKey(ms) {
    const d = new Date(ms);
    const day = d.getUTCDay() || 7;
    const monday = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 1);
    return fmtDate(monday);
  }

  function resample(candles, mode) {
    if (mode === 'daily') return candles;
    const map = new Map();
    for (const c of candles) {
      const d = new Date(c.t);
      let key;
      if (mode === 'weekly') key = weeklyKey(c.t);
      else if (mode === 'monthly') key = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
      else if (mode === 'yearly') key = String(d.getUTCFullYear());
      else key = fmtDate(c.t);
      map.set(key, c);
    }
    return Array.from(map.values()).sort((a, b) => a.t - b.t);
  }

  function priceSeries() {
    return [{
      label: state.mode === 'daily' ? '日足' : state.mode === 'weekly' ? '週足' : state.mode === 'monthly' ? '月足' : '年足',
      color: COLORS.price,
      points: resample(state.candles, state.mode).map(c => ({ x: c.t, y: c.close, t: c.t, price: c.close }))
    }];
  }

  function cycleSeries() {
    const maxDays = state.range === 'all' ? Infinity : Number(state.range);
    return state.analysis.athToAthSegments.map(seg => ({
      ...seg,
      points: seg.points.filter(p => p.x <= maxDays)
    })).filter(seg => seg.points.length);
  }

  function getSegments() {
    if (!state.candles.length || !state.analysis) return [];
    return state.mode === 'cycle' ? cycleSeries() : priceSeries();
  }

  function niceTicks(min, max, count) {
    if (!Number.isFinite(min) || !Number.isFinite(max) || min === max) return [min || 0, max || 1];
    const span = max - min;
    const raw = span / Math.max(1, count - 1);
    const pow = Math.pow(10, Math.floor(Math.log10(Math.abs(raw))));
    const norm = raw / pow;
    let step = pow;
    if (norm > 5) step = 10 * pow;
    else if (norm > 2) step = 5 * pow;
    else if (norm > 1) step = 2 * pow;
    const first = Math.floor(min / step) * step;
    const last = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = first; v <= last + step * 0.5; v += step) ticks.push(v);
    return ticks;
  }

  function logTicks(min, max) {
    const ticks = [];
    const start = Math.floor(Math.log10(Math.max(1, min)));
    const end = Math.ceil(Math.log10(Math.max(10, max)));
    for (let p = start; p <= end; p++) {
      for (const m of [1, 2, 5]) {
        const v = m * Math.pow(10, p);
        if (v >= min * 0.98 && v <= max * 1.02) ticks.push(v);
      }
    }
    return ticks.length ? ticks : niceTicks(min, max, 5);
  }

  function drawChart() {
    const canvas = $('chart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(320, Math.round(rect.width * dpr));
    canvas.height = Math.max(260, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);

    const segments = getSegments();
    if (!segments.length || !segments.some(s => s.points.length)) {
      ctx.fillStyle = '#8d99aa';
      ctx.font = '13px sans-serif';
      ctx.fillText('データ未取得', 18, 28);
      return;
    }

    const isCycle = state.mode === 'cycle';
    const all = segments.flatMap(s => s.points);
    let xMin = Math.min(...all.map(p => p.x));
    let xMax = Math.max(...all.map(p => p.x));
    let yMin = Math.min(...all.map(p => p.y));
    let yMax = Math.max(...all.map(p => p.y));
    const pad = { l: isCycle ? 58 : 62, r: 12, t: 12, b: 34 };
    const plotW = w - pad.l - pad.r;
    const plotH = h - pad.t - pad.b;

    if (isCycle) {
      yMin = Math.min(yMin, 0);
      yMax = Math.max(yMax, 0);
      const span = Math.max(10, yMax - yMin);
      yMin -= span * 0.08;
      yMax += span * 0.08;
    } else {
      yMin = Math.max(1, yMin * 0.88);
      yMax = yMax * 1.12;
    }
    if (xMin === xMax) xMax = xMin + 1;
    if (yMin === yMax) yMax = yMin + 1;

    const xScale = (x) => pad.l + ((x - xMin) / (xMax - xMin)) * plotW;
    let yScale;
    if (isCycle) {
      yScale = (y) => pad.t + (1 - ((y - yMin) / (yMax - yMin))) * plotH;
    } else {
      const logMin = Math.log10(Math.max(1, yMin));
      const logMax = Math.log10(Math.max(2, yMax));
      yScale = (y) => pad.t + (1 - ((Math.log10(Math.max(1, y)) - logMin) / (logMax - logMin))) * plotH;
    }

    ctx.lineWidth = 1;
    ctx.strokeStyle = '#202838';
    ctx.fillStyle = '#8d99aa';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    const yTicks = isCycle ? niceTicks(yMin, yMax, 6) : logTicks(yMin, yMax);
    for (const tick of yTicks) {
      const y = yScale(tick);
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(w - pad.r, y);
      ctx.stroke();
      ctx.fillText(isCycle ? fmtAxisPct(tick) : fmtUsd(tick), pad.l - 7, y);
    }

    const xTicks = niceTicks(xMin, xMax, 5);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const tick of xTicks) {
      const x = xScale(tick);
      ctx.beginPath();
      ctx.moveTo(x, pad.t);
      ctx.lineTo(x, h - pad.b);
      ctx.stroke();
      const label = isCycle ? Math.round(tick).toLocaleString('ja-JP') + '日' : fmtDate(tick).slice(0, 7);
      ctx.fillText(label, x, h - pad.b + 8);
    }

    ctx.strokeStyle = '#2b3546';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(pad.l, pad.t, plotW, plotH);

    if (isCycle && yMin < 0 && yMax > 0) {
      const y0 = yScale(0);
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#64748b';
      ctx.beginPath();
      ctx.moveTo(pad.l, y0);
      ctx.lineTo(w - pad.r, y0);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const seg of segments) {
      const pts = seg.points;
      if (!pts.length) continue;
      ctx.strokeStyle = seg.color;
      ctx.lineWidth = seg.label.includes('現在') ? 3 : 2.1;
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xScale(p.x);
        const y = yScale(p.y);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      const last = pts[pts.length - 1];
      ctx.fillStyle = seg.color;
      ctx.beginPath();
      ctx.arc(xScale(last.x), yScale(last.y), seg.label.includes('現在') ? 4 : 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function renderSummary() {
    const a = state.analysis;
    if (!a) return;
    $('latestPrice').textContent = fmtUsd(a.latest.close);
    $('latestDate').textContent = fmtDate(a.latest.t) + ' / 日足終値';
    $('athDays').textContent = a.currentDays.toLocaleString('ja-JP') + '日';
    $('currentDd').textContent = fmtPct(a.currentDrawdown);
    const met = a.latest.close <= SIXTY_K;
    $('sixtyCondition').textContent = met ? '達成' : '未達';
    $('sixtyCondition').className = 'metricValue ' + (met ? 'green' : '');
    $('conditionPill').textContent = met ? '条件到達' : '監視';
    $('conditionPill').className = 'pill ' + (met ? 'ready' : 'watch');
    $('positionLine').textContent = `現在ATHは ${fmtDate(a.currentPeak.t)} / ${fmtUsd(a.currentPeak.close)}。60,000ドル条件は${met ? '到達。月足と資金量を確認。' : '未達。まだ監視。'}`;
    const saved = state.savedAt ? new Date(state.savedAt).toLocaleString('ja-JP') : '';
    setTopStatus(saved ? `保存<br>${saved}` : `最新<br>${fmtDate(a.latest.t)}`);
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));
    $('rangeTabs').classList.toggle('show', state.mode === 'cycle');
    document.querySelectorAll('#rangeTabs button').forEach(btn => btn.classList.toggle('active', btn.dataset.range === state.range));
  }

  function renderLegend() {
    const segments = getSegments();
    $('legend').innerHTML = segments.map(s => `<span class="leg"><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('');
  }

  function renderNote() {
    if (state.mode === 'cycle') {
      const r = state.range === 'all' ? '全期間' : state.range + '日';
      $('chartNote').textContent = `ATH比較：開始ATHを0%として表示。表示期間は${r}。`;
    } else {
      const label = state.mode === 'daily' ? '日足' : state.mode === 'weekly' ? '週足' : state.mode === 'monthly' ? '月足' : '年足';
      $('chartNote').textContent = `${label}：終値ベース。長期確認のため価格軸は対数表示。`;
    }
  }

  function renderDetail() {
    if (!state.analysis) return;
    $('dataDetail').innerHTML = `
      ・価格はBinance BTCUSDTの日足終値。<br>
      ・現在ATH：${fmtDate(state.analysis.currentPeak.t)} / ${fmtUsd(state.analysis.currentPeak.close)}。<br>
      ・週足、月足、年足は日足終値から各期間の最終終値を抽出。ローソク足ではない。<br>
      ・ATH比較は、開始ATHを0%として次ATHまたは現在までを表示。<br>
      ・これは位置確認用。売買判断ではない。
    `;
  }

  function renderAll() {
    if (!state.candles.length) {
      renderTabs();
      drawChart();
      return;
    }
    state.analysis = analyze(state.candles);
    renderSummary();
    renderTabs();
    renderLegend();
    renderNote();
    renderDetail();
    drawChart();
  }

  async function handleFetch(silent = false) {
    try {
      if (!silent) setMessage('');
      $('fetchBtn').disabled = true;
      $('fetchBtn').textContent = '更新中';
      const data = await fetchAllData();
      state.candles = data.candles;
      state.source = data.source;
      state.savedAt = new Date().toISOString();
      saveData();
      renderAll();
      if (!silent) setMessage(`更新完了：${fmtDate(state.candles[0].t)}〜${fmtDate(state.candles[state.candles.length - 1].t)}`);
    } catch (err) {
      if (!silent) setMessage('更新失敗。保存データがあれば表示を継続。\n' + err.message);
      setTopStatus('更新失敗');
    } finally {
      $('fetchBtn').disabled = false;
      $('fetchBtn').textContent = '更新';
    }
  }

  function init() {
    $('fetchBtn').addEventListener('click', () => handleFetch(false));
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.mode;
        localStorage.setItem(MODE_KEY, state.mode);
        renderAll();
      });
    });
    document.querySelectorAll('#rangeTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        state.range = btn.dataset.range;
        localStorage.setItem(RANGE_KEY, state.range);
        renderAll();
      });
    });
    window.addEventListener('resize', () => drawChart());
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    try {
      loadSavedData();
      renderAll();
    } catch (_) {
      renderAll();
      handleFetch(true);
    }
  }

  init();
})();
</script>
</body>
</html>
